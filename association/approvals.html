<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Approvals - Market Association Fee Tracking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/mock-data.js"></script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased font-sans">

  <div id="app-layout">
    <div class="space-y-6">

      <!-- Top Title Bar -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-4 border-b border-slate-200">
        <div>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Member Verification & Approvals</h1>
        </div>

        <a href="./users.html" class="text-sm text-blue-700 hover:underline font-semibold flex items-center gap-1.5">
          View Complete Directory &rarr;
        </a>
      </div>

      <!-- Filters & Search Toolbar (Radio button filter) -->
      <div
        class="bg-white border border-slate-200 rounded-md p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-4 shadow-sm">

        <!-- Filter Radio Group -->
        <div class="flex items-center gap-2.5">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Filter:</span>
          <div
            class="flex flex-wrap items-center gap-3 bg-slate-50 border border-slate-200 rounded-md px-3 py-1.5 text-sm text-slate-700">
            <label class="inline-flex items-center gap-1.5 cursor-pointer font-medium hover:text-slate-900">
              <input type="radio" name="approval-filter" value="agents" checked onchange="renderApprovals()"
                class="w-4 h-4 text-blue-600 focus:ring-blue-500">
              <span>Agents (<span id="count-pending-agents">0</span>)</span>
            </label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer font-medium hover:text-slate-900">
              <input type="radio" name="approval-filter" value="traders" onchange="renderApprovals()"
                class="w-4 h-4 text-blue-600 focus:ring-blue-500">
              <span>Traders (<span id="count-pending-traders">0</span>)</span>
            </label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer font-medium hover:text-slate-900">
              <input type="radio" name="approval-filter" value="rejected" onchange="renderApprovals()"
                class="w-4 h-4 text-blue-600 focus:ring-blue-500">
              <span>Rejected (<span id="count-rejected">0</span>)</span>
            </label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer font-medium hover:text-slate-900">
              <input type="radio" name="approval-filter" value="all" onchange="renderApprovals()"
                class="w-4 h-4 text-blue-600 focus:ring-blue-500">
              <span>All (<span id="count-all">0</span>)</span>
            </label>
          </div>
        </div>

        <!-- Quick Search Input -->
        <div class="w-full lg:w-72">
          <input type="text" id="approval-search" oninput="renderApprovals()" placeholder="Search firm, name, mobile..."
            class="w-full px-3.5 py-2 border border-slate-300 rounded-md text-sm focus:border-blue-600 focus:outline-none">
        </div>

      </div>

      <!-- Approvals Register Table Card -->
      <div class="bg-white border border-slate-200 rounded-md overflow-hidden">

        <!-- Table (Proper Column Alignments, Status Column Removed) -->
        <div class="overflow-x-auto">
          <table class="erp-table">
            <thead>
              <tr>
                <th class="text-left">Code & Role</th>
                <th class="text-left">Firm & Contact Person</th>
                <th class="text-left">License / GSTIN</th>
                <th class="text-left">Mobile & Email</th>
                <th class="text-left">Yard / Business Address</th>
                <th class="text-right">Action</th>
              </tr>
            </thead>
            <tbody id="approvals-tbody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>

        <div id="approvals-foot">
          <!-- Rendered by renderStandardPagination -->
        </div>

      </div>

    </div>
  </div>

  <!-- Reject Reason Modal -->
  <div id="reject-modal" class="fixed inset-0 z-50 bg-slate-900/50 hidden flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-lg max-w-md w-full p-6 shadow-xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200">
        <h3 class="text-base font-bold text-slate-900">Reject Application</h3>
        <button onclick="closeRejectModal()"
          class="text-slate-400 hover:text-slate-700 text-xl font-bold leading-none">&times;</button>
      </div>
      <div class="py-4 space-y-3">
        <p class="text-sm text-slate-600">
          Specify the rejection reason for <strong id="reject-modal-firm" class="text-slate-900">Firm Name</strong>. An
          official notification will be dispatched via WhatsApp.
        </p>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="reject-reason-input">Reason for
            Rejection <span class="text-rose-600">*</span></label>
          <textarea id="reject-reason-input" rows="3"
            placeholder="e.g. Mandi license number invalid or expired on records."
            class="w-full text-sm p-3 border border-slate-300 rounded-md focus:border-blue-600 focus:outline-none"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-3 border-t border-slate-200">
        <button onclick="closeRejectModal()" class="btn-erp btn-erp-secondary text-sm px-4 py-2">Cancel</button>
        <button onclick="confirmRejectUser()" class="btn-erp btn-erp-danger text-sm px-4 py-2 font-semibold">Confirm
          Rejection</button>
      </div>
    </div>
  </div>

  <script src="../js/layout.js"></script>
  <script>
    let pendingActionUserId = null;
    let pendingActionRole = null;

    document.addEventListener("DOMContentLoaded", () => {
      renderApprovals();
    });

    function renderApprovals() {
      const selectedRadio = document.querySelector('input[name="approval-filter"]:checked');
      const filter = selectedRadio ? selectedRadio.value : "agents";
      const search = (document.getElementById("approval-search")?.value || "").toLowerCase().trim();

      const agents = AppState.getAgents();
      const traders = AppState.getTraders();

      const pendingAgents = agents.filter(a => a.status === "Pending").map(a => ({ ...a, role: "agent" }));
      const pendingTraders = traders.filter(t => t.status === "Pending").map(t => ({ ...t, role: "trader" }));
      const rejectedList = [
        ...agents.filter(a => a.status === "Rejected").map(a => ({ ...a, role: "agent" })),
        ...traders.filter(t => t.status === "Rejected").map(t => ({ ...t, role: "trader" }))
      ];
      const allList = [...pendingAgents, ...pendingTraders, ...rejectedList];

      document.getElementById("count-pending-agents").textContent = pendingAgents.length;
      document.getElementById("count-pending-traders").textContent = pendingTraders.length;
      document.getElementById("count-rejected").textContent = rejectedList.length;
      document.getElementById("count-all").textContent = allList.length;

      const totalPending = pendingAgents.length + pendingTraders.length;
      const totalBadge = document.getElementById("total-pending-badge");
      if (totalBadge) totalBadge.textContent = `${totalPending} Pending Approvals`;

      let itemsToRender = [];
      if (filter === "agents") itemsToRender = pendingAgents;
      else if (filter === "traders") itemsToRender = pendingTraders;
      else if (filter === "rejected") itemsToRender = rejectedList;
      else if (filter === "all") itemsToRender = allList;

      if (search) {
        itemsToRender = itemsToRender.filter(item =>
          item.firmName.toLowerCase().includes(search) ||
          item.name.toLowerCase().includes(search) ||
          item.id.toLowerCase().includes(search) ||
          item.mobile.includes(search)
        );
      }

      const tbody = document.getElementById("approvals-tbody");
      if (itemsToRender.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="py-8 text-center text-slate-500">
              No applications match this filter.
            </td>
          </tr>
        `;
        renderStandardPagination("approvals-foot", { totalItems: 0 });
        return;
      }

      tbody.innerHTML = itemsToRender.map(item => `
        <tr>
          <td class="text-left font-mono">
            <span class="font-bold text-slate-900">${item.id}</span>
            <span class="block text-xs text-slate-500 uppercase font-sans mt-0.5">${item.role}</span>
          </td>
          <td class="text-left">
            <div class="font-bold text-slate-900">${item.firmName}</div>
            <div class="text-xs text-slate-500 mt-0.5">${item.name}</div>
          </td>
          <td class="text-left font-mono text-slate-700">
            ${item.licenseNo || item.gstNo || "-"}
          </td>
          <td class="text-left">
            <div class="font-mono text-slate-900">+91 ${item.mobile}</div>
            <div class="text-xs text-slate-500 mt-0.5">${item.email}</div>
          </td>
          <td class="text-left text-slate-600 max-w-xs truncate" title="${item.address}">
            ${item.address}
          </td>
          <td class="text-right whitespace-nowrap">
            ${renderRowActions(item)}
          </td>
        </tr>
      `).join("");

      renderStandardPagination("approvals-foot", { totalItems: itemsToRender.length, pageSize: 10 });
    }

    function renderRowActions(item) {
      if (item.status === "Pending") {
        return `
          <button onclick="approveUser('${item.id}', '${item.role}')" class="btn-erp btn-erp-primary py-1 px-3 text-xs mr-2">
            Approve
          </button>
          <button onclick="openRejectModal('${item.id}', '${item.role}', '${item.firmName}')" class="btn-erp btn-erp-danger py-1 px-3 text-xs">
            Reject
          </button>
        `;
      }
      if (item.status === "Rejected") {
        return `
          <button onclick="approveUser('${item.id}', '${item.role}')" class="btn-erp btn-erp-primary py-1 px-3 text-xs">
            Approve
          </button>
        `;
      }
      return "";
    }

    function approveUser(userId, role) {
      showActionLoader("Approving application...", 250, () => {
        AppState.approveUser(userId, role);
        showToast(`${role === "agent" ? "Agent" : "Trader"} approved successfully.`, "success");
        renderApprovals();
      });
    }

    function openRejectModal(userId, role, firmName) {
      pendingActionUserId = userId;
      pendingActionRole = role;
      document.getElementById("reject-modal-firm").textContent = firmName;
      document.getElementById("reject-reason-input").value = "";
      document.getElementById("reject-modal").classList.remove("hidden");
    }

    function closeRejectModal() {
      document.getElementById("reject-modal").classList.add("hidden");
      pendingActionUserId = null;
      pendingActionRole = null;
    }

    function confirmRejectUser() {
      const reason = document.getElementById("reject-reason-input").value.trim();
      if (!reason) {
        showToast("Please enter a rejection reason.", "error");
        return;
      }
      showActionLoader("Rejecting application...", 250, () => {
        AppState.rejectUser(pendingActionUserId, pendingActionRole, reason);
        closeRejectModal();
        showToast("Application rejected.", "error");
        renderApprovals();
      });
    }
  </script>
</body>

</html>
