<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Settings - Fee Tracking System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/mock-data.js"></script>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased font-sans">

  <div id="app-layout">
    <div class="space-y-6">
      
      <!-- Top Title Bar -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-4 border-b border-slate-200">
        <div>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Rate Settings</h1>
        </div>
      </div>

      <!-- Rate Update Cards (Trader & Agent) -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- Trader Cess Update Card -->
        <div class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Trader Mandi Cess</span>
              <span class="status-badge badge-matched">Active Rate</span>
            </div>

            <!-- Current Rate Display -->
            <div class="py-4">
              <span class="text-xs text-slate-500 font-medium block">Current Rate</span>
              <div class="flex items-baseline gap-2 mt-1">
                <span id="current-trader-rate" class="text-3xl font-extrabold text-slate-900 font-mono tabular-nums">₹2.00</span>
                <span class="text-sm text-slate-500">per bag purchased</span>
              </div>
            </div>

            <!-- Update Form -->
            <form id="form-update-trader" onsubmit="handleUpdateTraderRate(event)" class="space-y-4 pt-4 border-t border-slate-100">
              <div>
                <label for="trader-new-rate" class="block text-sm font-semibold text-slate-700 mb-1.5">
                  New Rate Per Bag (₹) <span class="text-red-600">*</span>
                </label>
                <input type="number" id="trader-new-rate" step="0.05" min="0.10" required placeholder="e.g. 2.25"
                  class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md font-mono font-bold focus:border-blue-600 focus:outline-none">
              </div>

              <div>
                <label for="trader-effective-date" class="block text-sm font-semibold text-slate-700 mb-1.5">
                  Effective From Date <span class="text-red-600">*</span>
                </label>
                <input type="date" id="trader-effective-date" required
                  class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md focus:border-blue-600 focus:outline-none">
              </div>

              <div>
                <label for="trader-rate-notes" class="block text-sm font-semibold text-slate-700 mb-1.5">
                  Resolution / Reference Note
                </label>
                <input type="text" id="trader-rate-notes" placeholder="e.g. Resolution #42/2026 passed in Committee Meeting"
                  class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md focus:border-blue-600 focus:outline-none">
              </div>

              <div class="pt-2">
                <button type="submit" class="btn-erp btn-erp-primary text-sm w-full sm:w-auto px-5 py-2 font-semibold">
                  Update Trader Rate
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Commission Agent Fee Update Card -->
        <div class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Agent Facilitation Fee</span>
              <span class="status-badge badge-matched">Active Rate</span>
            </div>

            <!-- Current Rate Display -->
            <div class="py-4">
              <span class="text-xs text-slate-500 font-medium block">Current Rate</span>
              <div class="flex items-baseline gap-2 mt-1">
                <span id="current-agent-rate" class="text-3xl font-extrabold text-slate-900 font-mono tabular-nums">₹0.50</span>
                <span class="text-sm text-slate-500">per bag sold</span>
              </div>
            </div>

            <!-- Update Form -->
            <form id="form-update-agent" onsubmit="handleUpdateAgentRate(event)" class="space-y-4 pt-4 border-t border-slate-100">
              <div>
                <label for="agent-new-rate" class="block text-sm font-semibold text-slate-700 mb-1.5">
                  New Rate Per Bag (₹) <span class="text-red-600">*</span>
                </label>
                <input type="number" id="agent-new-rate" step="0.05" min="0.05" required placeholder="e.g. 0.60"
                  class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md font-mono font-bold focus:border-blue-600 focus:outline-none">
              </div>

              <div>
                <label for="agent-effective-date" class="block text-sm font-semibold text-slate-700 mb-1.5">
                  Effective From Date <span class="text-red-600">*</span>
                </label>
                <input type="date" id="agent-effective-date" required
                  class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md focus:border-blue-600 focus:outline-none">
              </div>

              <div>
                <label for="agent-rate-notes" class="block text-sm font-semibold text-slate-700 mb-1.5">
                  Resolution / Reference Note
                </label>
                <input type="text" id="agent-rate-notes" placeholder="e.g. Revision approved for yard maintenance"
                  class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md focus:border-blue-600 focus:outline-none">
              </div>

              <div class="pt-2">
                <button type="submit" class="btn-erp btn-erp-primary text-sm w-full sm:w-auto px-5 py-2 font-semibold">
                  Update Agent Rate
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="../js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const today = AppState.getTodayDate();
      document.getElementById("trader-effective-date").value = today;
      document.getElementById("agent-effective-date").value = today;
      refreshRateDisplay();
    });

    function refreshRateDisplay() {
      const rates = AppState.getRates();
      document.getElementById("current-trader-rate").textContent = `₹${rates.traderRate.toFixed(2)}`;
      document.getElementById("current-agent-rate").textContent = `₹${rates.agentRate.toFixed(2)}`;
    }

    function handleUpdateTraderRate(e) {
      e.preventDefault();
      const newRate = parseFloat(document.getElementById("trader-new-rate").value);
      const effectiveDate = document.getElementById("trader-effective-date").value;
      const notes = document.getElementById("trader-rate-notes").value.trim();

      if (isNaN(newRate) || newRate <= 0) {
        showToast("Rate must be a positive number.", "error");
        return;
      }

      showActionLoader("Updating trader cess...", 280, () => {
        AppState.changeRate("Trader", newRate, effectiveDate, notes || "General Committee Revision", "Association Secretariat");
        showToast(`Trader Mandi Cess updated to ₹${newRate.toFixed(2)} per bag.`, "success");
        document.getElementById("trader-new-rate").value = "";
        document.getElementById("trader-rate-notes").value = "";
        refreshRateDisplay();
      });
    }

    function handleUpdateAgentRate(e) {
      e.preventDefault();
      const newRate = parseFloat(document.getElementById("agent-new-rate").value);
      const effectiveDate = document.getElementById("agent-effective-date").value;
      const notes = document.getElementById("agent-rate-notes").value.trim();

      if (isNaN(newRate) || newRate <= 0) {
        showToast("Rate must be a positive number.", "error");
        return;
      }

      showActionLoader("Updating agent fee...", 280, () => {
        AppState.changeRate("Agent", newRate, effectiveDate, notes || "Yard Maintenance Revision", "Association Secretariat");
        showToast(`Agent Facilitation Fee updated to ₹${newRate.toFixed(2)} per bag.`, "success");
        document.getElementById("agent-new-rate").value = "";
        document.getElementById("agent-rate-notes").value = "";
        refreshRateDisplay();
      });
    }
  </script>
</body>
</html>
