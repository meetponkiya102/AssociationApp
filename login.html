<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Market Association Fee Tracking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/mock-data.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 antialiased font-sans">

  <!-- Login Card (Header & Footer removed as requested) -->
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-lg p-6 sm:p-8 shadow-sm">
    
    <!-- Branding & Title -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 mx-auto rounded-lg bg-[#1D4ED8] text-white font-bold text-lg flex items-center justify-center mb-3 shadow-sm">
        AP
      </div>
      <h1 class="text-xl font-bold text-slate-900">Market Association Fee Tracking</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in with your registered mobile or email</p>
    </div>

    <!-- Quick Demo Login Selection -->
    <div class="bg-slate-50 border border-slate-200 rounded-md p-3.5 mb-6">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-2 text-center">Quick Demo Login:</span>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" onclick="quickFill('association')" class="py-2 px-2.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-xs font-semibold text-slate-800 text-center truncate shadow-sm transition-colors">
          Admin
        </button>
        <button type="button" onclick="quickFill('agent')" class="py-2 px-2.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-xs font-semibold text-slate-800 text-center truncate shadow-sm transition-colors">
          Agent
        </button>
        <button type="button" onclick="quickFill('trader')" class="py-2 px-2.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-xs font-semibold text-slate-800 text-center truncate shadow-sm transition-colors">
          Trader
        </button>
      </div>
    </div>

    <!-- Form (Role dropdown removed; identified automatically by credentials) -->
    <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
      
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="login-identifier">Mobile Number or Email</label>
        <input type="text" id="login-identifier" value="secretary@apmc-unjha.in" placeholder="Enter mobile number or email" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-md focus:border-blue-600 focus:outline-none" required autocomplete="username">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-sm font-semibold text-slate-700" for="login-password">Password</label>
          <button type="button" onclick="handleForgotPassword()" class="text-xs text-blue-700 hover:underline">Forgot password?</button>
        </div>
        <div class="relative">
          <input type="password" id="login-password" value="admin123" placeholder="Enter password" class="w-full pl-3.5 pr-11 py-2.5 text-sm border border-slate-300 rounded-md font-mono focus:border-blue-600 focus:outline-none" required autocomplete="current-password">
          <button type="button" id="toggle-password-btn" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700 focus:outline-none" title="Show or hide password" aria-label="Show or hide password">
            <!-- Eye Icon (shown when password hidden) -->
            <svg id="eye-icon-show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <!-- Eye Crossed Icon (shown when password visible) -->
            <svg id="eye-icon-hide" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full py-2.5 px-4 bg-[#1D4ED8] hover:bg-[#1E40AF] text-white font-semibold text-sm rounded-md transition-colors shadow-sm">
          Sign In
        </button>
      </div>

    </form>

    <!-- Registration Links -->
    <div class="mt-6 pt-5 border-t border-slate-200 text-sm text-center space-y-2">
      <div class="text-slate-500">Need to create an account?</div>
      <div class="flex justify-center space-x-4 font-medium">
        <a href="./register-agent.html" class="text-blue-700 hover:underline">Register as Agent</a>
        <span class="text-slate-300">|</span>
        <a href="./register-trader.html" class="text-blue-700 hover:underline">Register as Trader</a>
      </div>
      <div>
        <a href="./index.html" class="inline-block text-xs text-slate-500 hover:text-slate-800 mt-2">&larr; Back to Portal Index</a>
      </div>
    </div>

  </div>

  <div id="toast-container"></div>
  <script src="./js/layout.js"></script>
  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById("login-password");
      const eyeShow = document.getElementById("eye-icon-show");
      const eyeHide = document.getElementById("eye-icon-hide");

      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        eyeShow.classList.add("hidden");
        eyeHide.classList.remove("hidden");
      } else {
        pwdInput.type = "password";
        eyeShow.classList.remove("hidden");
        eyeHide.classList.add("hidden");
      }
    }

    function quickFill(role) {
      if (role === "association") {
        document.getElementById("login-identifier").value = "secretary@apmc-unjha.in";
        document.getElementById("login-password").value = "admin123";
        handleLoginDirect("association");
      } else if (role === "agent") {
        document.getElementById("login-identifier").value = "9825012345";
        document.getElementById("login-password").value = "agent123";
        handleLoginDirect("agent", "AGT-101");
      } else if (role === "trader") {
        document.getElementById("login-identifier").value = "9898011223";
        document.getElementById("login-password").value = "trader123";
        handleLoginDirect("trader", "TRD-201");
      }
    }

    function handleLoginDirect(role, id) {
      AppState.setCurrentRole(role, id);
      if (role === "association") window.location.href = "./association/dashboard.html";
      if (role === "agent") window.location.href = "./agent/dashboard.html";
      if (role === "trader") window.location.href = "./trader/dashboard.html";
    }

    function handleLogin(e) {
      e.preventDefault();
      const identifier = (document.getElementById("login-identifier").value || "").trim();
      const password = (document.getElementById("login-password").value || "").trim();

      if (!identifier) {
        showToast("Please enter your mobile number or email address.", "error");
        return;
      }

      const lowerId = identifier.toLowerCase();

      // 1. Association Office / Admin Detection
      if (
        lowerId === "secretary@apmc-unjha.in" ||
        lowerId === "admin@apmc.in" ||
        lowerId === "admin" ||
        lowerId.includes("admin") ||
        lowerId.includes("secretary") ||
        lowerId.includes("association")
      ) {
        handleLoginDirect("association");
        return;
      }

      // 2. Commission Agent Detection
      const agents = AppState.getAgents();
      const agent = agents.find(a => 
        a.mobile === identifier ||
        a.email.toLowerCase() === lowerId ||
        a.id.toLowerCase() === lowerId
      );

      if (agent) {
        if (agent.status === "Pending") {
          showToast("Your Agent account is pending approval by the Association.", "warning");
          return;
        }
        if (agent.status === "Suspended") {
          showToast("Your Agent account has been suspended. Please contact the office.", "error");
          return;
        }
        handleLoginDirect("agent", agent.id);
        return;
      }

      // 3. Registered Trader Detection
      const traders = AppState.getTraders();
      const trader = traders.find(t => 
        t.mobile === identifier ||
        t.email.toLowerCase() === lowerId ||
        t.id.toLowerCase() === lowerId
      );

      if (trader) {
        if (trader.status === "Pending") {
          showToast("Your Trader registration is pending verification.", "warning");
          return;
        }
        if (trader.status === "Rejected") {
          showToast("Trader registration was rejected. Please contact the office.", "error");
          return;
        }
        handleLoginDirect("trader", trader.id);
        return;
      }

      // 4. Pattern / Heuristic Fallbacks for demo flexibility
      if (lowerId.startsWith("agt") || identifier.startsWith("9825") || lowerId.includes("agent") || password.toLowerCase().includes("agent")) {
        handleLoginDirect("agent", "AGT-101");
        return;
      }

      if (lowerId.startsWith("trd") || identifier.startsWith("9898") || lowerId.includes("trader") || password.toLowerCase().includes("trader")) {
        handleLoginDirect("trader", "TRD-201");
        return;
      }

      // Unknown credentials
      showToast("Account not found for this mobile/email. Please check your credentials.", "error");
    }

    function handleForgotPassword() {
      showToast("Password reset link sent to your registered mobile number via WhatsApp.", "whatsapp");
    }
  </script>
</body>
</html>
